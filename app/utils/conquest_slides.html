<style>
  .slide-tools { padding: 14px 2px 8px; color: #172b45; }
  .slide-tools button { border: 1px solid #bdcbd9; border-radius: 7px; background: #fff;
    color: #172b45; padding: 10px 16px; font: 600 14px system-ui, sans-serif; cursor: pointer; }
  .slide-tools button:hover { border-color: #28669c; background: #edf4fb; }
  .slide-tools button:disabled { opacity: .55; cursor: default; }
  .slide-tools button:focus-visible { outline: 3px solid #398ddd; outline-offset: 2px; }
  .slide-actions { display: flex; flex-wrap: wrap; gap: 8px; }
  .slide-status { font: 14px/1.5 system-ui, sans-serif; margin: 10px 0; }
  .slide-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
  .slide-grid figure { margin: 0; min-width: 0; }
  .slide-grid img { width: 100%; height: auto; display: block; background: #e5e7eb; }
  .slide-grid figcaption { display: flex; gap: 8px; align-items: center; justify-content: space-between;
    padding: 10px 0; font: 600 14px system-ui, sans-serif; }
  .slide-tools [hidden] { display: none !important; }
  @media (max-width: 600px) { .slide-grid { grid-template-columns: 1fr; } }
</style>
<section class="slide-tools" aria-label="Conquest map slides">
  <div class="slide-actions">
    <button id="make-slides" type="button" disabled aria-controls="slide-results">Show slide images</button>
    <button id="hide-slides" type="button" hidden aria-controls="slide-results">Hide slide images</button>
  </div>
  <p id="slide-status" class="slide-status" role="status" aria-live="polite">Loading map…</p>
  <div id="slide-results" hidden>
    <p class="slide-status">Three 2160 × 2700 portrait PNGs (4:5): a continuous two-slide map and school rankings.
      Copy each slide and paste it into your Instagram carousel.
      You can also right-click an image and choose Copy Image.</p>
    <div class="slide-grid">
      <figure>
        <img id="slide-image-0" alt="Slide 1: conquest map rules and the western half of the map" />
        <figcaption>Slide 1 <button type="button" class="copy-slide" data-slide="0" disabled>Copy slide 1</button></figcaption>
      </figure>
      <figure>
        <img id="slide-image-1" alt="Slide 2: the matching eastern half of the conquest map" />
        <figcaption>Slide 2 <button type="button" class="copy-slide" data-slide="1" disabled>Copy slide 2</button></figcaption>
      </figure>
      <figure>
        <img id="slide-image-2" alt="Slide 3: top schools by counties owned and land area owned, with team logos" />
        <p id="ranking-error" class="slide-status" role="status" hidden></p>
        <figcaption>Slide 3 <button type="button" class="copy-slide" data-slide="2" disabled>Copy slide 3</button></figcaption>
      </figure>
    </div>
  </div>
</section>
<script>
(() => {
  const config = __CONQUEST_SLIDE_CONFIG__;
  __CONQUEST_RANKING_HELPERS__
  const makeButton = document.getElementById("make-slides");
  const hideButton = document.getElementById("hide-slides");
  const results = document.getElementById("slide-results");
  const status = document.getElementById("slide-status");
  const copyButtons = [...document.querySelectorAll(".copy-slide")];
  const slideWidth = 2160;
  const slideHeight = 2700;
  const headerHeight = 308;
  const headingFont = 'Impact, "Arial Narrow", "Helvetica Neue", sans-serif';
  let blobs = [];
  let previewUrls = [];
  let revision = 0;
  let generatedRevision = -1;
  let generating = false;
  let schools = [];
  let rankingError = "";
  const inlineLogoCache = new Map();

  // Resize our own frame and its layout container for older components.html
  // hosts. Current st.iframe also measures srcdoc content automatically.
  // Scrolling remains available if same-origin frame access is unavailable.
  function resizeFrame() {
    const height = Math.ceil(document.body.getBoundingClientRect().height) + 12;
    try {
      const frame = window.frameElement;
      if (frame) {
        frame.style.height = `${height}px`;
        const container = frame.closest('[data-testid="stElementContainer"]');
        if (container) container.style.height = "auto";
      }
    } catch (_) { /* The component's scrollbar remains available. */ }
  }
  new ResizeObserver(resizeFrame).observe(document.body);

  window.addEventListener("conquest-map-ready", event => {
    try {
      schools = summarizeCountyOwnership(event.detail.counties, config.countyLandAreaM2);
      if (!schools.length) throw new Error("No school ownership is available for this map.");
      rankingError = "";
    } catch (error) {
      rankingError = error.message;
    }
    makeButton.disabled = false;
    status.textContent = "Position your logos, then show the three slide images to copy and paste.";
  });
  window.addEventListener("conquest-map-error", () => {
    status.textContent = "The map could not load. Reload the page to try again.";
  });
  window.addEventListener("conquest-map-changed", () => {
    revision += 1;
    if (!blobs.length && !generating) return;
    copyButtons.forEach(button => { button.disabled = true; });
    results.hidden = true;
    hideButton.hidden = true;
    makeButton.textContent = "Update slide images";
    status.textContent = "Logo positions changed. Update the slide images before copying.";
  });

  function blobToDataUrl(blob) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result);
      reader.onerror = reject;
      reader.readAsDataURL(blob);
    });
  }

  function loadImage(url) {
    return new Promise((resolve, reject) => {
      const image = new Image();
      image.onload = () => resolve(image);
      image.onerror = () => reject(new Error("An image could not be rendered. Please try again."));
      image.src = url;
    });
  }

  async function inlineLogo(url) {
    if (url.startsWith("data:")) return url;
    if (!inlineLogoCache.has(url)) {
      inlineLogoCache.set(url, (async () => {
        const controller = new AbortController();
        const timeout = setTimeout(() => controller.abort(), 20000);
        try {
          const response = await fetch(url, { mode: "cors", credentials: "omit", signal: controller.signal });
          if (!response.ok) throw new Error(`HTTP ${response.status}`);
          const data = await blobToDataUrl(await response.blob());
          await loadImage(data);
          return data;
        } finally {
          clearTimeout(timeout);
        }
      })());
    }
    try { return await inlineLogoCache.get(url); }
    catch (error) { inlineLogoCache.delete(url); throw error; }
  }

  // SVG images do not inherit page CSS or load external nested images. Embed both
  // so the high-resolution render matches the current map, including dragged logos.
  function styledClone(original) {
    const clone = original.cloneNode(true);
    const originals = [original, ...original.querySelectorAll("*")];
    const clones = [clone, ...clone.querySelectorAll("*")];
    const properties = ["fill", "fill-opacity", "stroke", "stroke-width", "stroke-opacity",
      "stroke-linejoin", "stroke-linecap", "font-family", "font-size", "font-weight",
      "letter-spacing", "text-anchor", "dominant-baseline", "paint-order", "filter", "opacity"];
    originals.forEach((element, index) => {
      const style = getComputedStyle(element);
      properties.forEach(property => clones[index].style.setProperty(property, style.getPropertyValue(property)));
      clones[index].style.setProperty("vector-effect", "none");
    });
    return clone;
  }

  async function renderMap() {
    const map = styledClone(document.getElementById("county-map"));
    const logos = styledClone(document.getElementById("logo-layer"));
    map.append(...logos.childNodes);
    await Promise.all([...map.querySelectorAll("image")].map(async image => {
      const url = image.getAttribute("href");
      if (!url || url.startsWith("data:")) return;
      try {
        image.setAttribute("href", await inlineLogo(url));
      } catch (error) {
        const name = image.parentElement.querySelector("title")?.textContent.split("\n")[0] || "a team";
        console.warn("Conquest slide logo failed", { name, url, error });
        throw new Error(`The logo for ${name} could not be loaded (${error.message}). Refresh the page to retry. Logo URL: ${url}`);
      }
    }));
    map.setAttribute("xmlns", "http://www.w3.org/2000/svg");
    map.setAttribute("width", "1200");
    map.setAttribute("height", "760");
    const url = URL.createObjectURL(new Blob([new XMLSerializer().serializeToString(map)], { type: "image/svg+xml" }));
    try { return await loadImage(url); }
    finally { URL.revokeObjectURL(url); }
  }

  function wrappedLines(context, text, maxWidth) {
    const lines = [];
    let line = "";
    for (const word of text.split(/\s+/)) {
      const next = line ? `${line} ${word}` : word;
      if (line && context.measureText(next).width > maxWidth) {
        lines.push(line);
        line = word;
      } else line = next;
    }
    if (line) lines.push(line);
    // Avoid a lone final word or number (for example the "4" in "Power 4").
    if (lines.length > 1 && !lines.at(-1).includes(" ")) {
      const previous = lines.at(-2).split(" ");
      const last = `${previous.at(-1)} ${lines.at(-1)}`;
      if (previous.length > 1 && context.measureText(last).width <= maxWidth) {
        previous.pop();
        lines[lines.length - 2] = previous.join(" ");
        lines[lines.length - 1] = last;
      }
    }
    return lines;
  }

  function fittedText(context, text, x, y, maxWidth, initialSize) {
    let fontSize = initialSize;
    do {
      context.font = `400 ${fontSize}px ${headingFont}`;
      if (context.measureText(text).width <= maxWidth) break;
      fontSize -= 1;
    } while (fontSize > 24);
    context.fillText(text, x, y);
  }

  function drawHeader(context, count = 2, title = "CONQUEST MAP") {
    context.fillStyle = "#0c2c50";
    context.fillRect(0, 0, slideWidth * count, headerHeight);
    context.fillStyle = "#e4bd72";
    context.fillRect(0, headerHeight - 8, slideWidth * count, 8);
    context.textBaseline = "top";
    // Repeat the heading so either slide makes sense when viewed on its own.
    for (let index = 0; index < count; index += 1) {
      const left = index * slideWidth + 80;
      const right = (index + 1) * slideWidth - 80;
      context.textAlign = "left";
      context.fillStyle = "#e4bd72";
      fittedText(context, "BG.ANALYTICS CFB", left, 62, 1110, 48);
      context.fillStyle = "#ffffff";
      fittedText(context, title, left, 132, 1110, 112);
      context.textAlign = "right";
      context.fillStyle = "#e4bd72";
      fittedText(context, `${config.season} SEASON`, right, 42, 810, 86);
      context.fillStyle = "#ffffff";
      fittedText(context, config.week.toUpperCase(), right, 168, 810, 96);
    }
  }

  function drawRules(context, panelWidth) {
    context.fillStyle = "#0c2c50";
    context.fillRect(0, headerHeight, panelWidth, slideHeight - headerHeight);
    context.textBaseline = "top";
    const left = 56;
    const available = panelWidth - left * 2;
    context.textAlign = "left";
    context.fillStyle = "#e4bd72";
    fittedText(context, "MAP RULES", left, 432, available, 80);
    context.fillRect(left, 542, 112, 6);

    const rulesTop = 628;
    const rulesBottom = 2540;
    const ruleGap = 100;
    let fontSize = 66;
    let ruleLines;
    // Fit all rules as one block without squeezing or clipping individual lines.
    do {
      context.font = `400 ${fontSize}px ${headingFont}`;
      ruleLines = config.rules.map((rule, i) => wrappedLines(context, `${i + 1}. ${rule.toUpperCase()}`, available));
      const textHeight = ruleLines.reduce((sum, lines) => sum + lines.length * fontSize * 1.2, 0);
      if (textHeight + ruleGap * (ruleLines.length - 1) <= rulesBottom - rulesTop) break;
      fontSize -= 1;
    } while (fontSize > 32);
    context.fillStyle = "#ffffff";
    let y = rulesTop;
    for (const lines of ruleLines) {
      for (const line of lines) {
        context.fillText(line, left, y);
        y += fontSize * 1.2;
      }
      y += ruleGap;
    }
  }

  function pngBlob(canvas) {
    return new Promise((resolve, reject) => canvas.toBlob(blob => {
      if (blob) resolve(blob);
      else reject(new Error("Could not create the PNG. Please try again."));
    }, "image/png"));
  }

  function drawRankingSlide(context, countyLeaders, areaLeaders, logos) {
    context.fillStyle = "#edf0f3";
    context.fillRect(0, 0, slideWidth, slideHeight);
    drawHeader(context, 1, "LAND LEADERS");
    context.textAlign = "left";
    context.fillStyle = "#0c2c50";
    fittedText(context, "WHO OWNS THE MAP?", 80, 394, 2000, 88);
    context.font = '42px Arial, sans-serif';
    context.fillText(`Top ${Math.min(10, schools.length)} schools · ${config.scope}`, 80, 510);
    const columns = [
      { x: 80, title: "MOST COUNTIES", rows: countyLeaders, metric: "counties" },
      { x: 1112, title: "MOST LAND AREA", rows: areaLeaders, metric: "landAreaM2" },
    ];
    for (const column of columns) {
      context.textAlign = "left";
      context.fillStyle = "#0c2c50";
      fittedText(context, column.title, column.x, 602, 968, 68);
      context.fillStyle = "#e4bd72";
      context.fillRect(column.x, 690, 968, 6);
      column.rows.forEach((school, index) => {
        const y = 732 + index * 178;
        context.fillStyle = school.rank === 1 ? "#fbf1dc" : "#ffffff";
        context.fillRect(column.x, y, 968, 162);
        context.fillStyle = school.color;
        context.fillRect(column.x, y, 7, 162);
        context.fillStyle = "#0c2c50";
        context.textAlign = "center";
        fittedText(context, String(school.rank), column.x + 53, y + 53, 76, 58);
        context.fillStyle = "#ffffff";
        context.fillRect(column.x + 105, y + 23, 116, 116);
        const logo = logos.get(school.teamId);
        const scale = Math.min(100 / logo.width, 100 / logo.height);
        context.drawImage(logo, column.x + 163 - logo.width * scale / 2,
          y + 81 - logo.height * scale / 2, logo.width * scale, logo.height * scale);
        context.textAlign = "left";
        context.fillStyle = "#0c2c50";
        fittedText(context, school.name.toUpperCase(), column.x + 246, y + 24, 698, 58);
        const value = column.metric === "counties"
          ? `${school.counties.toLocaleString("en-US")} ${school.counties === 1 ? "county" : "counties"}`
          : `${Math.round(school.landAreaM2 / 2589988.110336).toLocaleString("en-US")} sq mi`;
        context.fillStyle = "#41546b";
        context.font = '46px Arial, sans-serif';
        context.fillText(value, column.x + 246, y + 97);
      });
    }
    context.fillStyle = "#41546b";
    context.textAlign = "left";
    context.font = '34px Arial, sans-serif';
    context.fillText("Current ownership · Land only, including Alaska and Hawaii · Equal totals share a rank", 80, 2570);
    context.font = '30px Arial, sans-serif';
    context.fillText("Area: U.S. Census 2017 county measurements, matched to this map’s boundaries", 80, 2620);
  }

  async function renderRankingSlide() {
    if (rankingError) throw new Error(rankingError);
    const countyLeaders = rankSchools(schools, "counties");
    const areaLeaders = rankSchools(schools, "landAreaM2");
    const leaders = new Map([...countyLeaders, ...areaLeaders].map(school => [school.teamId, school]));
    const logos = new Map(await Promise.all([...leaders.values()].map(async school => {
      try {
        if (!school.logo) throw new Error("No team logo is available");
        return [school.teamId, await loadImage(await inlineLogo(school.logo))];
      } catch (error) {
        throw new Error(`Cannot load ${school.name}’s logo for slide 3: ${error.message}. Refresh the page to retry.`);
      }
    })));
    const slide = document.createElement("canvas");
    slide.width = slideWidth;
    slide.height = slideHeight;
    drawRankingSlide(slide.getContext("2d"), countyLeaders, areaLeaders, logos);
    return pngBlob(slide);
  }

  makeButton.addEventListener("click", async () => {
    if (blobs.length && generatedRevision === revision) {
      results.hidden = false;
      hideButton.hidden = false;
      return;
    }
    makeButton.disabled = true;
    generating = true;
    status.textContent = "Preparing full-resolution slide images…";
    const snapshotRevision = revision;
    try {
      const map = await renderMap();
      const panorama = document.createElement("canvas");
      panorama.width = slideWidth * 2;
      panorama.height = slideHeight;
      const context = panorama.getContext("2d");
      context.fillStyle = "#e5e7eb";
      context.fillRect(0, 0, panorama.width, panorama.height);
      const panelWidth = 820;
      const mapAreaHeight = slideHeight - headerHeight;
      const scale = Math.min((panorama.width - panelWidth) / 1200, mapAreaHeight / 760);
      const mapWidth = 1200 * scale;
      const mapHeight = 760 * scale;
      context.drawImage(map, panelWidth + (panorama.width - panelWidth - mapWidth) / 2,
        headerHeight + (mapAreaHeight - mapHeight) / 2, mapWidth, mapHeight);
      drawHeader(context);
      drawRules(context, panelWidth);
      // Crop the same panorama at an integer pixel boundary for a seamless pair.
      const nextBlobs = await Promise.all([0, 1].map(index => {
        const slide = document.createElement("canvas");
        slide.width = slideWidth;
        slide.height = slideHeight;
        slide.getContext("2d").drawImage(panorama, index * slideWidth, 0, slideWidth, slideHeight,
          0, 0, slideWidth, slideHeight);
        return pngBlob(slide);
      }));
      let summaryError = "";
      try { nextBlobs.push(await renderRankingSlide()); }
      catch (error) {
        nextBlobs.push(null);
        summaryError = error.message;
      }
      if (snapshotRevision !== revision) {
        status.textContent = "Logo positions changed while preparing slides. Click Update slide images to try again.";
        return;
      }
      const nextUrls = nextBlobs.map(blob => blob ? URL.createObjectURL(blob) : null);
      await Promise.all(nextUrls.filter(Boolean).map(loadImage));
      nextUrls.forEach((url, index) => {
        const image = document.getElementById(`slide-image-${index}`);
        image.hidden = !url;
        if (url) image.src = url;
        else image.removeAttribute("src");
      });
      const errorMessage = document.getElementById("ranking-error");
      errorMessage.textContent = summaryError;
      errorMessage.hidden = !summaryError;
      previewUrls.filter(Boolean).forEach(url => URL.revokeObjectURL(url));
      previewUrls = nextUrls;
      blobs = nextBlobs;
      generatedRevision = summaryError ? -1 : snapshotRevision;
      results.hidden = false;
      hideButton.hidden = false;
      makeButton.textContent = summaryError ? "Retry slide images" : "Show slide images";
      copyButtons.forEach(button => { button.disabled = !blobs[Number(button.dataset.slide)]; });
      status.textContent = summaryError ? "Map slides are ready. Slide 3 needs attention below."
        : "Ready. Copy and paste slides 1, 2, and 3 in order.";
    } catch (error) {
      status.textContent = error.message || "Could not prepare the slides. Please try again.";
    } finally {
      generating = false;
      makeButton.disabled = false;
    }
  });

  hideButton.addEventListener("click", () => {
    results.hidden = true;
    hideButton.hidden = true;
  });
  copyButtons.forEach(button => button.addEventListener("click", async () => {
    const index = Number(button.dataset.slide);
    if (copyButtons[index].disabled || !blobs[index]) return;
    try {
      if (!navigator.clipboard?.write || !window.ClipboardItem) throw new Error("Clipboard unavailable");
      // Blobs are already ready: the clipboard write stays inside the user gesture,
      // which is required by Safari and by browsers with strict clipboard policies.
      await navigator.clipboard.write([new ClipboardItem({ "image/png": blobs[index] })]);
      status.textContent = `Slide ${index + 1} copied at full resolution. Paste it into your slide or post.`;
    } catch (_) {
      status.textContent = `Your browser blocked the copy button. Right-click slide ${index + 1} and choose Copy Image (on a phone, touch and hold the image).`;
    }
  }));
})();
</script>
